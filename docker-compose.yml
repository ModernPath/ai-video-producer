services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avd
      POSTGRES_PASSWORD: avd
      POSTGRES_DB: avd
    ports:
      - "54329:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avd"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: avd
      MINIO_ROOT_PASSWORD: avd-secret
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - ./data/minio:/data
